<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Two</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #10231c 0%, #0c130f 60%);
        color: #e7f2ec;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: #123a2a;
        color: #5ce0a0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      h1 { font-size: clamp(32px, 8vw, 56px); margin: 0 0 12px; }
      p { color: #86a596; font-size: 16px; max-width: 420px; margin: 0 auto; line-height: 1.5; }
      code { color: #5ce0a0; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">virtual host</span>
      <h1>Project Two</h1>
      <p>
        Это отдельный проект на втором домене (например
        <code>project2.local</code>). Соседний сайт TODO List его контент
        не отдаёт — nginx разводит запросы по <code>server_name</code>.
      </p>
    </main>
  </body>
</html>
