<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — страница не найдена</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #191c23;
        --text: #e7e9ee;
        --muted: #8a90a0;
        --accent: #4f8cff;
        --accent-hover: #3b78ee;
        --border: #2b303b;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2030 0%, var(--bg) 60%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        text-align: center;
      }
      .code {
        font-size: clamp(88px, 22vw, 140px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -4px;
        background: linear-gradient(180deg, #eef2ff 0%, var(--accent) 120%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0;
      }
      h1 {
        font-size: 22px;
        margin: 12px 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 28px;
      }
      .btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
      }
      .btn:hover { background: var(--accent-hover); }
      .meta {
        margin-top: 28px;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>Такой страницы нет</h1>
      <p>Похоже, вы свернули не туда. Ссылка устарела или адрес набран с ошибкой.</p>
      <a class="btn" href="/">На главную</a>
      <p class="meta">nginx · TODO List</p>
    </main>
  </body>
</html>
