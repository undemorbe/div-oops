# worker работает под этим пользователем — иначе nobody не читает файлы
# под /Users/<user> (домашний каталог закрыт для остальных → 403 Permission denied).
user dolbobob staff;

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    upstream todo_backend {
        server 127.0.0.1:5040 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:5041 max_fails=1 fail_timeout=5s;
    }

    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name todo.local project2.local;
        return 301 https://$host$request_uri;
    }

    #  TODO
    server {
        listen 443 ssl;
        server_name todo.local;

        ssl_certificate     /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab0/frontend/localhost.pem;
        ssl_certificate_key /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab0/frontend/localhost-key.pem;

        root /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab0/frontend/dist;
        index index.html;

        error_page 404 /_errors/404.html;
        error_page 500 502 503 504 /_errors/50x.html;
        location = /_errors/404.html {
            alias /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab1/html/errors/404.html;
            internal;
        }
        location = /_errors/50x.html {
            alias /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab1/html/errors/50x.html;
            internal;
        }

        location /docs/ {
            alias /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab1/nginx/docs/;
            index index.html;
        }

        location /admin {
            auth_basic "Restricted";
            auth_basic_user_file /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab1/.htpasswd;
            root /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab1/html;
            index index.html;
        }

        # API → балансировка на upstream + rate limit
        location /api/ {
            limit_req zone=api_zone burst=10 nodelay;

            proxy_pass http://todo_backend;
            add_header X-Upstream $upstream_addr always;   # кто ответил

            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # virtual host
    server {
        listen 443 ssl;
        server_name project2.local;

        ssl_certificate     /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab0/frontend/localhost.pem;
        ssl_certificate_key /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab0/frontend/localhost-key.pem;

        root /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab1/html/site2;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }

    # Чужой Host
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab0/frontend/localhost.pem;
        ssl_certificate_key /Users/dolbobob/Programming/Oblaka/site-dev-ops/lab0/frontend/localhost-key.pem;

        return 444;   # рвём соединение для неизвестных доменов
    }
}
