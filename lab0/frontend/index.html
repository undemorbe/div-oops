<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO List</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>TODO List</h1>
        <span id="mode-badge" class="badge" title="Источник данных"></span>
      </header>

      <form id="task-form" class="form" autocomplete="off">
        <input
          id="task-input"
          class="form__input"
          type="text"
          name="title"
          placeholder="Что нужно сделать?"
          maxlength="200"
          required
        />
        <button id="task-submit" class="form__button" type="submit">Добавить</button>
      </form>

      <p id="status" class="status" role="status"></p>

      <ul id="task-list" class="list"></ul>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
