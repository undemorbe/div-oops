services:
  frontend:
    build:
      context: ../lab0/frontend
      dockerfile: ../../lab2/Dockerfile.frontend
      args:
        VITE_BACKEND_URL: /api
    image: todo-frontend:good
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - frontend-net

  backend:
    build:
      context: ../lab0/backend
      dockerfile: ../../lab2/Dockerfile.backend
    image: todo-backend:good
    environment:
      PORT: "5040"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER не задан в lab2/.env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в lab2/.env}
      DB_NAME: ${DB_NAME:?DB_NAME не задан в lab2/.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER не задан в lab2/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в lab2/.env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME не задан в lab2/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend-net

networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  postgres-data:
