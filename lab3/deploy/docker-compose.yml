# "Прод" для Лабы 3. Собирать здесь нечего — только готовые образы из GHCR по неизменяемому тегу sha-<commit>.
# APP_TAG и DB_PASSWORD приходят из deploy.sh (в CI — из секретов GitHub), в репозитории их нет.
name: todo-prod

services:
  frontend:
    image: ${REGISTRY:-ghcr.io/undemorbe/div-oops}/frontend:${APP_TAG:?APP_TAG is required}
    ports:
      - "8088:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.00
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

  backend:
    image: ${REGISTRY:-ghcr.io/undemorbe/div-oops}/backend:${APP_TAG:?APP_TAG is required}
    environment:
      PORT: "5040"
      INSTANCE_ID: "backend@${APP_TAG}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: todo_list_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: todo_list_db
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.00
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    mem_limit: 256m
    cpus: 2.00
    environment:
      POSTGRES_USER: todo_list_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: todo_list_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend-net

networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  postgres-data:
